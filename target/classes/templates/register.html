<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Query Raise App - Register</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: 600; }
        input[type="text"], input[type="email"], input[type="password"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-size: 1em; font-weight: bold; }
        button:hover { background: #218838; }
        .error { color: red; text-align: center; margin-bottom: 10px; }
        .dynamic-field { display: none; }
    </style>
    <script>
        function toggleDynamicField() {
            var userType = document.getElementById("userType").value;
            var empField = document.getElementById("employeeDynamicField");
            if (userType === "Employee") {
                empField.style.display = "block";
            } else {
                empField.style.display = "none";
            }
        }
    </script>
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required>
        </div>
        <div class="form-group">
            <label>Email ID</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>User Type</label>
            <select name="userType" id="userType" onchange="toggleDynamicField()" required>
                <option value="">--Select Type--</option>
                <option value="Student">Student</option>
                <option value="Employee">Employee</option>
            </select>
        </div>
        <!-- Dynamic field required only for employees -->
        <div class="form-group dynamic-field" id="employeeDynamicField">
            <label>Team Lead Name</label>
            <input type="text" name="teamLeadName">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required>
        </div>
        <div class="form-group">
            <label>Retype Password</label>
            <input type="password" name="retypePassword" required>
        </div>
        <button type="submit">Register Account</button>
    </form>
    <div style="text-align: center; margin-top: 15px;"><a href="/">Back to Login</a></div>
</div>
</body>
</html>
